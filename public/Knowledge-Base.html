<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Knowledge Base - IT Support</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .navbar {
            background: #1e293b;
            color: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
        }

        /* =========================
           BUTTON
        ========================= */

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
        }

        .primary-btn {
            background: #2563eb;
            color: white;
        }

        .primary-btn:hover {
            background: #1d4ed8;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .view-btn {
            background: #475569;
            color: white;
        }

        /* =========================
           SEARCH / FILTER
        ========================= */

        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);

            display: flex;
            gap: 15px;
        }

        .filters input,
        .filters select {
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        .filters input {
            flex: 1;
        }

        /* =========================
           ARTICLE CARDS
        ========================= */

        .articles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .article-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .article-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .category {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .problem {
            color: #4b5563;
            margin-bottom: 10px;
        }

        .resolution {
            color: #111827;
            font-weight: bold;
        }

        .article-footer {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .article-actions {
            display: flex;
            gap: 6px;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            color: #6b7280;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;

            position: fixed;
            z-index: 1000;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.5);

            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 650px;

            max-height: 90vh;
            overflow-y: auto;

            border-radius: 10px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            font-size: 28px;
            cursor: pointer;
            color: #6b7280;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;

            border: 1px solid #d1d5db;
            border-radius: 6px;

            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #111827;
        }

        /* =========================
           VIEW MODAL
        ========================= */

        .view-section {
            margin-bottom: 20px;
        }

        .view-section h4 {
            margin-bottom: 6px;
        }

        .view-section p {
            white-space: pre-wrap;
            line-height: 1.5;
        }

        @media (max-width: 700px) {

            .filters {
                flex-direction: column;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .articles {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================= -->

    <div class="navbar">

        <h2>IT Support</h2>

        <div class="nav-links">

            <a href="/staff.html">
                Dashboard
            </a>

            <a href="/Knowledge-Base.html">
                Knowledge Base
            </a>

            <a href="/staff-profile.html">
                Staff Profile
            </a>

        </div>

    </div>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <div class="container">

        <div class="page-header">

            <div>
                <h1>Knowledge Base</h1>

                <p>
                    Troubleshooting guides and IT support solutions
                </p>
            </div>

            <button
                class="primary-btn"
                onclick="openCreateModal()"
            >
                + Create Article
            </button>

        </div>


        <!-- =========================
             SEARCH / FILTER
        ========================= -->

        <div class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Search knowledge base..."
                oninput="filterArticles()"
            >

            <select
                id="categoryFilter"
                onchange="filterArticles()"
            >

                <option value="">
                    All Categories
                </option>

                <option value="Hardware">
                    Hardware
                </option>

                <option value="Software">
                    Software
                </option>

                <option value="Network">
                    Network
                </option>

                <option value="Email">
                    Email
                </option>

                <option value="Account">
                    Account
                </option>

                <option value="General">
                    General
                </option>

            </select>

        </div>


        <!-- =========================
             ARTICLES
        ========================= -->

        <div
            id="articles"
            class="articles"
        ></div>

    </div>


    <!-- =====================================================
         CREATE / EDIT MODAL
    ====================================================== -->

    <div
        id="articleModal"
        class="modal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Create Article
                </h2>

                <span
                    class="close"
                    onclick="closeArticleModal()"
                >
                    &times;
                </span>

            </div>


            <form id="articleForm">

                <div class="form-group">

                    <label>
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select
                        id="category"
                        required
                    >

                        <option value="">
                            Select category
                        </option>

                        <option value="Hardware">
                            Hardware
                        </option>

                        <option value="Software">
                            Software
                        </option>

                        <option value="Network">
                            Network
                        </option>

                        <option value="Email">
                            Email
                        </option>

                        <option value="Account">
                            Account
                        </option>

                        <option value="General">
                            General
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Problem
                    </label>

                    <textarea
                        id="problem"
                        required
                        placeholder="Describe the problem..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Solution
                    </label>

                    <textarea
                        id="solution"
                        required
                        placeholder="Explain the steps to solve the problem..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Resolution
                    </label>

                    <textarea
                        id="resolution"
                        required
                        placeholder="Describe the final resolution..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Author
                    </label>

                    <input
                        type="text"
                        id="author"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select id="status">

                        <option value="Published">
                            Published
                        </option>

                        <option value="Draft">
                            Draft
                        </option>

                    </select>

                </div>


                <div class="form-buttons">

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="closeArticleModal()"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Save Article
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =====================================================
         VIEW ARTICLE MODAL
    ====================================================== -->

    <div
        id="viewModal"
        class="modal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="viewTitle"></h2>

                <span
                    class="close"
                    onclick="closeViewModal()"
                >
                    &times;
                </span>

            </div>


            <div class="view-section">

                <span
                    id="viewCategory"
                    class="category"
                ></span>

            </div>


            <div class="view-section">

                <h4>
                    Problem
                </h4>

                <p id="viewProblem"></p>

            </div>


            <div class="view-section">

                <h4>
                    Solution
                </h4>

                <p id="viewSolution"></p>

            </div>


            <div class="view-section">

                <h4>
                    Resolution
                </h4>

                <p id="viewResolution"></p>

            </div>


            <div class="view-section">

                <h4>
                    Author
                </h4>

                <p id="viewAuthor"></p>

            </div>


            <div class="view-section">

                <h4>
                    Status
                </h4>

                <p id="viewStatus"></p>

            </div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        let articles = [];

        let editingArticleId = null;


        // ====================================================
        // LOAD ARTICLES
        // ====================================================

        async function loadArticles() {

            try {

                const response =
                    await fetch("/api/knowledge-base");

                const data =
                    await response.json();

                if (!data.success) {

                    alert("Failed to load knowledge base.");

                    return;
                }

                articles = data.articles || [];

                displayArticles(articles);

            }

            catch (error) {

                console.error(error);

                alert(
                    "Unable to connect to the server."
                );

            }

        }


        // ====================================================
        // DISPLAY ARTICLES
        // ====================================================

        function displayArticles(articleList) {

            const container =
                document.getElementById("articles");

            container.innerHTML = "";


            if (articleList.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        No knowledge base articles found.
                    </div>
                `;

                return;
            }


            articleList.forEach(article => {

                const card =
                    document.createElement("div");

                card.className = "article-card";


                card.innerHTML = `

                    <span class="category">
                        ${escapeHtml(article.Category || "General")}
                    </span>

                    <h3>
                        ${escapeHtml(article.Title || "Untitled")}
                    </h3>

                    <div class="problem">

                        <strong>
                            Problem:
                        </strong>

                        ${escapeHtml(
                            article.Problem || ""
                        )}

                    </div>

                    <div class="resolution">

                        <strong>
                            Resolution:
                        </strong>

                        ${escapeHtml(
                            article.Resolution || ""
                        )}

                    </div>

                    <div class="article-footer">

                        <small>
                            By ${escapeHtml(
                                article.Author || "Unknown"
                            )}
                        </small>

                        <div class="article-actions">

                            <button
                                class="view-btn"
                                onclick="viewArticle('${article["Article ID"]}')"
                            >
                                View
                            </button>

                            <button
                                class="edit-btn"
                                onclick="editArticle('${article["Article ID"]}')"
                            >
                                Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteArticle('${article["Article ID"]}')"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                `;


                container.appendChild(card);

            });

        }


        // ====================================================
        // SEARCH / FILTER
        // ====================================================

        function filterArticles() {

            const search =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase();

            const category =
                document
                    .getElementById("categoryFilter")
                    .value;


            const filtered =
                articles.filter(article => {

                    const matchesSearch =

                        !search ||

                        String(article.Title || "")
                            .toLowerCase()
                            .includes(search)

                        ||

                        String(article.Problem || "")
                            .toLowerCase()
                            .includes(search)

                        ||

                        String(article.Solution || "")
                            .toLowerCase()
                            .includes(search)

                        ||

                        String(article.Resolution || "")
                            .toLowerCase()
                            .includes(search);


                    const matchesCategory =

                        !category ||

                        article.Category === category;


                    return (
                        matchesSearch &&
                        matchesCategory
                    );

                });


            displayArticles(filtered);

        }


        // ====================================================
        // OPEN CREATE MODAL
        // ====================================================

        function openCreateModal() {

            editingArticleId = null;

            document
                .getElementById("modalTitle")
                .textContent = "Create Article";

            document
                .getElementById("articleForm")
                .reset();

            document
                .getElementById("articleModal")
                .style.display = "flex";

        }


        // ====================================================
        // CLOSE CREATE / EDIT MODAL
        // ====================================================

        function closeArticleModal() {

            document
                .getElementById("articleModal")
                .style.display = "none";

        }


        // ====================================================
        // CREATE / UPDATE ARTICLE
        // ====================================================

        document
            .getElementById("articleForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const article = {

                        title:
                            document
                                .getElementById("title")
                                .value
                                .trim(),

                        category:
                            document
                                .getElementById("category")
                                .value,

                        problem:
                            document
                                .getElementById("problem")
                                .value
                                .trim(),

                        solution:
                            document
                                .getElementById("solution")
                                .value
                                .trim(),

                        resolution:
                            document
                                .getElementById("resolution")
                                .value
                                .trim(),

                        author:
                            document
                                .getElementById("author")
                                .value
                                .trim(),

                        status:
                            document
                                .getElementById("status")
                                .value

                    };


                    try {

                        let response;


                        // UPDATE

                        if (editingArticleId) {

                            response =
                                await fetch(
                                    `/api/knowledge-base/${encodeURIComponent(editingArticleId)}`,
                                    {
                                        method: "PUT",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify(article)
                                    }
                                );

                        }

                        // CREATE

                        else {

                            response =
                                await fetch(
                                    "/api/knowledge-base",
                                    {
                                        method: "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify(article)
                                    }
                                );

                        }


                        const data =
                            await response.json();


                        if (!data.success) {

                            alert(
                                data.message ||
                                "Failed to save article."
                            );

                            return;
                        }


                        closeArticleModal();

                        await loadArticles();

                    }

                    catch (error) {

                        console.error(error);

                        alert(
                            "Unable to save article."
                        );

                    }

                }
            );


        // ====================================================
        // EDIT ARTICLE
        // ====================================================

        function editArticle(articleId) {

            const article =
                articles.find(
                    item =>
                        String(item["Article ID"]) ===
                        String(articleId)
                );


            if (!article) {

                alert("Article not found.");

                return;
            }


            editingArticleId =
                article["Article ID"];


            document
                .getElementById("modalTitle")
                .textContent = "Edit Article";


            document
                .getElementById("title")
                .value =
                    article.Title || "";


            document
                .getElementById("category")
                .value =
                    article.Category || "";


            document
                .getElementById("problem")
                .value =
                    article.Problem || "";


            document
                .getElementById("solution")
                .value =
                    article.Solution || "";


            document
                .getElementById("resolution")
                .value =
                    article.Resolution || "";


            document
                .getElementById("author")
                .value =
                    article.Author || "";


            document
                .getElementById("status")
                .value =
                    article.Status || "Published";


            document
                .getElementById("articleModal")
                .style.display = "flex";

        }


        // ====================================================
        // VIEW ARTICLE
        // ====================================================

        function viewArticle(articleId) {

            const article =
                articles.find(
                    item =>
                        String(item["Article ID"]) ===
                        String(articleId)
                );


            if (!article) {

                alert("Article not found.");

                return;
            }


            document
                .getElementById("viewTitle")
                .textContent =
                    article.Title || "Untitled";


            document
                .getElementById("viewCategory")
                .textContent =
                    article.Category || "General";


            document
                .getElementById("viewProblem")
                .textContent =
                    article.Problem || "";


            document
                .getElementById("viewSolution")
                .textContent =
                    article.Solution || "";


            document
                .getElementById("viewResolution")
                .textContent =
                    article.Resolution || "";


            document
                .getElementById("viewAuthor")
                .textContent =
                    article.Author || "Unknown";


            document
                .getElementById("viewStatus")
                .textContent =
                    article.Status || "";


            document
                .getElementById("viewModal")
                .style.display = "flex";

        }


        // ====================================================
        // CLOSE VIEW MODAL
        // ====================================================

        function closeViewModal() {

            document
                .getElementById("viewModal")
                .style.display = "none";

        }


        // ====================================================
        // DELETE ARTICLE
        // ====================================================

        async function deleteArticle(articleId) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this article?"
                );


            if (!confirmed) {

                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/knowledge-base/${encodeURIComponent(articleId)}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    alert(
                        data.message ||
                        "Failed to delete article."
                    );

                    return;
                }


                await loadArticles();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Unable to delete article."
                );

            }

        }


        // ====================================================
        // HTML ESCAPING
        // ====================================================

        function escapeHtml(value) {

            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }


        // ====================================================
        // CLOSE MODALS WHEN CLICKING OUTSIDE
        // ====================================================

        window.onclick = function(event) {

            const articleModal =
                document.getElementById(
                    "articleModal"
                );

            const viewModal =
                document.getElementById(
                    "viewModal"
                );


            if (event.target === articleModal) {

                closeArticleModal();

            }


            if (event.target === viewModal) {

                closeViewModal();

            }

        };


        // ====================================================
        // INITIAL LOAD
        // ====================================================

        loadArticles();

    </script>

</body>

</html>
